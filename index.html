<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字轉換器</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>
    <style>
      @font-face {
        font-family: "kim";
        src: url("./fonts/kim.ttf") format("truetype");
      }

      @font-face {
        font-family: "kim2";
        src: url("./fonts/kim2.ttf") format("truetype");
      }

      @font-face {
        font-family: "xiao-yao";
        src: url("./fonts/xiao-yao.ttf") format("truetype");
      }

      @font-face {
        font-family: "qian-li";
        src: url("./fonts/qian-li.ttf") format("truetype");
      }

      @font-face {
        font-family: "beauty";
        src: url("./fonts/beauty.ttf") format("truetype");
      }

      @font-face {
        font-family: "PenCrane";
        src: url("./fonts/PenCrane.ttf") format("truetype");
      }

      @font-face {
        font-family: "HuiZongGongTi";
        src: url("./fonts/HuiZongGongTi.ttf") format("truetype");
      }

      @font-face {
        font-family: "hua-kang-hang-shu";
        src: url("./fonts/hua-kang-hang-shu.ttf") format("truetype");
      }

      @font-face {
        font-family: "hua-kang-hang-kai";
        src: url("./fonts/hua-kang-hang-kai.ttf") format("truetype");
      }

      @font-face {
        font-family: "ThePeak";
        src: url("./fonts/ThePeak.ttf") format("truetype");
      }

      @font-face {
        font-family: "HanyiSentyPine";
        src: url("./fonts/HanyiSentyPine.ttf") format("truetype");
      }

      @font-face {
        font-family: "whz-zhong-hang-shu";
        src: url("./fonts/whz-zhong-hang-shu.ttf") format("truetype");
      }

      @font-face {
        font-family: "kaiu";
        src: url("./fonts/kaiu.ttf") format("truetype");
      }

      @font-face {
        font-family: "gothic-r";
        src: url("./fonts/gothic-regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "gothic-b";
        src: url("./fonts/gothic-bold.ttf") format("truetype");
      }

      @font-face {
        font-family: "gothic-bl";
        src: url("./fonts/gothic-black.ttf") format("truetype");
      }

      @font-face {
        font-family: "ThenKhung";
        src: url("./fonts/ThenKhung.ttf") format("truetype");
      }

      @font-face {
        font-family: "JiaGu";
        src: url("./fonts/JiaGuWen.ttf") format("truetype");
      }

      @font-face {
        font-family: "ChenYuluoyan";
        src: url("./fonts/ChenYuluoyan.ttf") format("truetype");
      }

      @font-face {
        font-family: "TinHeng";
        src: url("./fonts/TinHeng.ttf") format("truetype");
      }

      @font-face {
        font-family: "YuWeiYunMo";
        src: url("./fonts/YuWeiYunMo.ttf") format("truetype");
      }

      @font-face {
        font-family: "YuWeiXingShu";
        src: url("./fonts/YuWeiXingShu.ttf") format("truetype");
      }

      @font-face {
        font-family: "WawaTC";
        src: url("./fonts/WawaTC-Regular.otf") format("opentype");
      }

      @font-face {
        font-family: "hua-kang-hou-jin";
        src: url("./fonts/hua-kang-hou-jin.ttf") format("truetype");
      }

      @font-face {
        font-family: "DunHuangRuShi";
        src: url("./fonts/DunHuangRuShi.ttf") format("truetype");
      }

      @font-face {
        font-family: "Zapfino";
        src: url("./fonts/Zapfino.ttf") format("truetype");
      }

      @font-face {
        font-family: "WeibeiTC";
        src: url("./fonts/WeibeiTC-Bold.otf") format("opentype");
      }

      @font-face {
        font-family: "YuppyTC";
        src: url("./fonts/YuppyTC-Regular.otf") format("opentype");
      }

      @font-face {
        font-family: "XingkaiTC";
        src: url("./fonts/Xingkai.ttc") format("truetype");
      }

      @font-face {
        font-family: "LingWaiTC";
        src: url("./fonts/LingWaiTC-Medium.otf") format("opentype");
      }

      @font-face {
        font-family: "HannotateTC";
        src: url("./fonts/Hannotate.ttc") format("truetype");
      }

      @font-face {
        font-family: "HanziPenTC";
        src: url("./fonts/Hanzipen.ttc") format("truetype");
      }

      body {
        background-color: #0a192f;
        color: #64c4ff;
        font-family: "Courier New", monospace;
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .text-container {
        margin-top: 20px;
        width: 100%;
        max-width: 800px;
        display: flex;
        justify-content: center;
      }

      .text-display {
        font-family: "kaiu";
        font-size: 56px;
        line-height: 1;
        background-color: white;
        padding: 50px;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(100, 128, 255, 0.3);
        color: rgb(180, 180, 180);
        transition: all 0.3s ease;
        width: fit-content;
        white-space: nowrap;
      }

      .vertical-mode {
        writing-mode: vertical-rl;
      }

      .horizontal-mode {
        writing-mode: horizontal-tb;
        width: fit-content;
      }

      p {
        margin: 0;
      }

      .control-form {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 20px;
        background-color: rgba(10, 25, 47, 0.8);
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 30px rgba(100, 128, 255, 0.2);
        border: 1px solid #64c4ff;
        width: 100%;
        max-width: 800px;
      }

      .control-form h1 {
        margin-bottom: 20px;
        color: #64c4ff;
        font-size: 28px;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 0 10px rgba(100, 128, 255, 0.5);
      }

      .control-form textarea,
      .control-form input,
      .control-form button,
      .control-form select {
        margin-bottom: 15px;
        background-color: #172a45;
        color: #64c4ff;
        border: 1px solid #64c4ff;
        padding: 12px;
        border-radius: 5px;
        font-size: 16px;
        font-family: "Courier New", monospace;
        transition: all 0.3s ease;
      }

      .control-form textarea {
        width: 100%;
        max-width: 500px;
        height: 100px;
        resize: vertical;
      }

      .control-form input[type="number"] {
        width: 100px;
      }

      .control-form button {
        cursor: pointer;
        width: 120px;
        background-color: #64c4ff;
        color: #0a192f;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .control-form button:hover {
        background-color: #0a192f;
        color: #64c4ff;
        box-shadow: 0 0 10px rgba(100, 128, 255, 0.5);
      }

      .control-form textarea:focus,
      .control-form input[type="number"]:focus,
      .control-form select:focus {
        outline: none;
        box-shadow: 0 0 10px rgba(100, 128, 255, 0.5);
      }

      .input-group {
        display: flex;
        justify-content: space-between;
        width: 100%;
        margin-bottom: 15px;
        column-gap: 10px;
      }

      .input-group label {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .input-group input {
        margin-top: 5px;
      }

      #export-btn {
        margin-top: 15px;
      }

      #font-family-select {
        margin-top: 5px;
      }

      .display-toggle {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
        width: 100%;
        max-width: 800px;
      }

      .toggle-button {
        background-color: #172a45;
        color: #64c4ff;
        border: 1px solid #64c4ff;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-family: "Courier New", monospace;
        font-size: 16px;
        transition: all 0.3s ease;
        margin: 0 5px;
      }

      .toggle-button:hover {
        background-color: #64c4ff;
        color: #0a192f;
      }

      .toggle-button.active {
        background-color: #64c4ff;
        color: #0a192f;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="control-form">
      <h1>文字轉換器</h1>
      <textarea
        id="input-text"
        rows="10"
        cols="50"
        placeholder="在此輸入文字..."
      ></textarea>
      <div class="input-group">
        <label>
          行高
          <input
            type="number"
            id="line-height-input"
            min="0"
            max="2"
            step="0.1"
            value="1"
            onchange="changeLineHeight()"
          />
        </label>
        <label>
          字體大小
          <input
            type="number"
            id="font-size-input"
            min="0"
            max="100"
            value="56"
            onchange="changeFontSize()"
          />
        </label>
        <label>
          字距
          <input
            type="number"
            id="letter-spacing-input"
            min="0"
            max="10"
            step="1"
            value="0"
            onchange="changeLetterSpacing()"
          />
        </label>
        <label>
          字體
          <select id="font-family-select" onchange="changeFontFamily()">
            <option value="kim">翠竹仙鶴瘦金體</option>
            <option value="kim2">方正瘦金體</option>
            <option value="xiao-yao">逍遙遊經典楷書</option>
            <option value="qian-li">千里江山行楷體</option>
            <option value="beauty">簪花美人楷</option>
            <option value="PenCrane">鋼筆手書體</option>
            <option value="HuiZongGongTi">華康徽宗宮體</option>
            <option value="hua-kang-hang-shu">華康行書體</option>
            <option value="hua-kang-hang-kai">華康行楷體</option>
            <option value="hua-kang-hou-jin">華康瘦金體</option>
            <option value="ThePeak">隨𡶶體</option>
            <option value="HanyiSentyPine">漢儀新蒂青松小楷</option>
            <option value="whz-zhong-hang-shu">王漢宗中行書體</option>
            <option value="kaiu">標楷體</option>
            <option value="gothic-r">黑薔薇哥德 (標準)</option>
            <option value="gothic-b">黑薔薇哥德 (粗體)</option>
            <option value="gothic-bl">黑薔薇哥德 (黑體)</option>
            <option value="ThenKhung">宇文天穹</option>
            <option value="JiaGu">方正甲骨文</option>
            <option value="ChenYuluoyan">辰宇落雁体</option>
            <option value="TinHeng">字魂白鸽天行体</option>
            <option value="YuWeiYunMo">禹衛書法雲墨繁體</option>
            <option value="YuWeiXingShu">禹衛書法行書繁體</option>
            <option value="WawaTC">娃娃體</option>
            <option value="DunHuangRuShi">敦煌如是小楷書</option>
            <option value="WeibeiTC">魏碑</option>
            <option value="YuppyTC">雅痞</option>
            <option value="XingkaiTC">行楷</option>
            <option value="LingWaiTC">凌慧體</option>
            <option value="HannotateTC">手札體</option>
            <option value="HanziPenTC">翩翩體</option>
            <option value="Zapfino">Zapfino</option>
          </select>
        </label>
        <label>
          字體顏色
          <select id="font-color-select" onchange="changeFontColor()">
            <option value="#000000">黑色</option>
            <option value="#b4b4b4">灰色</option>
          </select>
        </label>
      </div>
      <button onclick="splitText()">轉換文字</button>
    </div>

    <div class="display-toggle">
      <button class="toggle-button active" onclick="setDisplayMode('vertical')">
        直式顯示
      </button>
      <button class="toggle-button" onclick="setDisplayMode('horizontal')">
        橫式顯示
      </button>
    </div>

    <div class="text-container">
      <div class="text-display vertical-mode" id="output-text"></div>
    </div>

    <script>
      let currentMode = "vertical";

      function splitText() {
        const inputText = document.getElementById("input-text").value;
        const lines = inputText.split("\n");
        const outputText = document.getElementById("output-text");
        outputText.innerHTML = lines.map((line) => `<p>${line}</p>`).join("");
      }

      function changeLineHeight() {
        const lineHeightInput = document.getElementById("line-height-input");
        const outputText = document.getElementById("output-text");
        outputText.style.lineHeight = lineHeightInput.value;
      }

      function changeFontSize() {
        const fontSizeInput = document.getElementById("font-size-input");
        const outputText = document.getElementById("output-text");
        outputText.style.fontSize = fontSizeInput.value + "px";
      }

      function changeFontFamily() {
        const fontFamilySelect = document.getElementById("font-family-select");
        const outputText = document.getElementById("output-text");
        outputText.style.fontFamily = fontFamilySelect.value;
      }

      function changeLetterSpacing() {
        const letterSpacingInput = document.getElementById(
          "letter-spacing-input",
        );
        const outputText = document.getElementById("output-text");
        outputText.style.letterSpacing = letterSpacingInput.value + "px";
      }

      function changeFontColor() {
        const fontColorSelect = document.getElementById("font-color-select");
        const outputText = document.getElementById("output-text");
        outputText.style.color = fontColorSelect.value;
      }

      function setDisplayMode(mode) {
        const outputText = document.getElementById("output-text");
        const verticalButton = document.querySelector(
          "[onclick=\"setDisplayMode('vertical')\"]",
        );
        const horizontalButton = document.querySelector(
          "[onclick=\"setDisplayMode('horizontal')\"]",
        );

        if (mode === "vertical") {
          outputText.classList.remove("horizontal-mode");
          outputText.classList.add("vertical-mode");
          verticalButton.classList.add("active");
          horizontalButton.classList.remove("active");
          currentMode = "vertical";
        } else {
          outputText.classList.remove("vertical-mode");
          outputText.classList.add("horizontal-mode");
          verticalButton.classList.remove("active");
          horizontalButton.classList.add("active");
          currentMode = "horizontal";
        }
      }
    </script>
  </body>
</html>
